<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Analytics Dashboard</title>
  
  <!-- โหลด Tailwind CSS สำหรับจัดการความสวยงาม -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- โหลดฟอนต์ภาษาไทย Sarabun -->
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- โหลด Babel สำหรับแปลงโค้ด React (JSX) ให้ทำงานบนเบราว์เซอร์ได้โดยตรง -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Sarabun', sans-serif;
      background-color: #f8fafc; /* slate-50 */
    }
  </style>
</head>
<body>
  <!-- จุดที่ React จะนำแอปพลิเคชันมาแสดงผล -->
  <div id="root"></div>

  <!-- โค้ดหลักของแอปพลิเคชัน (React + JSX) -->
  <script type="text/babel" data-type="module">
    // นำเข้า React และไลบรารีที่จำเป็นผ่าน esm.sh (CDN สำหรับ ES Modules)
    import React, { useState, useMemo, useEffect } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { Upload, FileText, Activity, Grid, AlertCircle, X, BarChart2, TrendingUp, Loader, Download, Info, Table, PlusCircle, Trash2, CheckCircle2, Play, Shuffle } from 'https://esm.sh/lucide-react@0.292.0';
    import { ScatterChart, Scatter, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } from 'https://esm.sh/recharts@2.12.0?deps=react@18.2.0,react-dom@18.2.0';

    // --- Utility Functions ---

    const parseCSV = (text) => {
      const rows = [];
      let currentRow = [];
      let currentVal = '';
      let insideQuote = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (insideQuote && nextChar === '"') {
            currentVal += '"';
            i++; 
          } else {
            insideQuote = !insideQuote;
          }
        } else if (char === ',' && !insideQuote) {
          currentRow.push(currentVal); 
          currentVal = '';
        } else if ((char === '\n' || char === '\r') && !insideQuote) {
          if (char === '\r' && nextChar === '\n') i++;
          currentRow.push(currentVal);
          rows.push(currentRow);
          currentRow = [];
          currentVal = '';
        } else {
          currentVal += char;
        }
      }
      
      if (currentRow.length > 0 || currentVal) {
        currentRow.push(currentVal);
        rows.push(currentRow);
      }

      if (rows.length < 2) return { headers: [], data: [] };

      const headers = rows[0].map(h => cleanHeader(h));
      
      const data = rows.slice(1).map((row) => {
        if (row.length === 1 && row[0].trim() === '') return null;
        const entry = {};
        headers.forEach((header, i) => {
          let val = row[i];
          if (typeof val === 'string') {
            val = val.trim().replace(/^"|"$/g, '');
          } else {
            val = '';
          }
          const numVal = parseFloat(val);
          entry[header] = isNaN(numVal) ? val : numVal;
        });
        return entry;
      }).filter(row => row !== null);

      return { headers, data };
    };

    const cleanHeader = (header) => {
      if (typeof header !== 'string') return String(header);
      return header.trim().replace(/^"|"$/g, '').replace(/\r?\n/g, ' ').replace(/\s+/g, ' ').trim();
    };

    // Statistics Calculations
    const calculateStats = (arr) => {
      const n = arr.length;
      if (n === 0) return { mean: 0, sd: 0 };
      const mean = arr.reduce((a, b) => a + b, 0) / n;
      const variance = arr.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / n;
      return { mean, sd: Math.sqrt(variance) };
    };

    const calculateCorrelation = (xArray, yArray) => {
      const n = xArray.length;
      if (n !== yArray.length || n === 0) return 0;
      
      const xStats = calculateStats(xArray);
      const yStats = calculateStats(yArray);
      
      if (xStats.sd === 0 || yStats.sd === 0) return 0;

      let sumProduct = 0;
      for (let i = 0; i < n; i++) {
        sumProduct += (xArray[i] - xStats.mean) * (yArray[i] - yStats.mean);
      }
      
      return sumProduct / (n * xStats.sd * yStats.sd);
    };

    // Calculate p-value using t-distribution
    const calculatePValue = (r, n) => {
      if (n <= 2) return 1;
      if (Math.abs(r) >= 0.999999) return 0;
      
      const t = Math.abs(r * Math.sqrt((n - 2) / (1 - r * r)));
      
      if (window.jStat && window.jStat.studentt) {
        return 2 * (1 - window.jStat.studentt.cdf(t, n - 2));
      }
      return NaN;
    };

    // Helper for significance stars
    const getSignificanceStars = (p) => {
      if (p < 0.001) return '***';
      if (p < 0.01) return '**';
      if (p < 0.05) return '*';
      return 'ns'; 
    };

    // Interpretation Helper
    const interpretCorrelation = (r) => {
      const absR = Math.abs(r);
      let strength = "";
      if (absR >= 0.8) strength = "สูงมาก";
      else if (absR >= 0.6) strength = "สูง";
      else if (absR >= 0.4) strength = "ปานกลาง";
      else if (absR >= 0.2) strength = "ต่ำ";
      else strength = "ไม่มีความสัมพันธ์ชัดเจน";

      if (absR < 0.2) return strength;
      return r > 0 ? `แปรผันตามกัน (${strength})` : `แปรผกผัน (${strength})`;
    };

    // --- Components ---

    const Card = ({ children, className = "", id = "" }) => (
      <div id={id} className={`bg-white rounded-xl shadow-sm border border-slate-200 ${className}`}>
        {children}
      </div>
    );

    const StatBadge = ({ label, value, color = "bg-slate-50 text-slate-700" }) => (
      <div className={`flex items-center gap-2 px-2.5 py-1 rounded text-xs font-medium border ${color}`}>
        <span className="opacity-70">{label}:</span>
        <span className="font-semibold">{typeof value === 'number' ? value.toFixed(3) : value}</span>
      </div>
    );

    const FileUploader = ({ onFileSelected }) => {
      const [dragActive, setDragActive] = useState(false);

      const handleDrag = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.type === "dragenter" || e.type === "dragover") {
          setDragActive(true);
        } else if (e.type === "dragleave") {
          setDragActive(false);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setDragActive(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          onFileSelected(e.dataTransfer.files[0]);
        }
      };

      const handleChange = (e) => {
        e.preventDefault();
        if (e.target.files && e.target.files[0]) {
          onFileSelected(e.target.files[0]);
        }
      };

      return (
        <div 
          className={`relative flex flex-col items-center justify-center w-full p-8 transition-all border-2 border-dashed rounded-xl cursor-pointer
            ${dragActive ? 'border-blue-500 bg-blue-50' : 'border-slate-300 bg-slate-50 hover:bg-slate-100'}`}
          onDragEnter={handleDrag}
          onDragLeave={handleDrag}
          onDragOver={handleDrag}
          onDrop={handleDrop}
        >
          <input 
            type="file" 
            className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" 
            onChange={handleChange}
            accept=".csv, .xlsx, .xls"
          />
          <div className="bg-white p-4 rounded-full shadow-sm mb-4 border border-slate-100">
            <Upload className="w-8 h-8 text-blue-500" />
          </div>
          <h3 className="text-lg font-bold text-slate-700 mb-1">ลากไฟล์มาวางที่นี่ หรือ คลิกเพื่อเลือกไฟล์</h3>
          <p className="text-sm text-slate-500 mb-4">รองรับไฟล์ประเภท .CSV, .XLSX, .XLS</p>
          
          <div className="w-full max-w-md bg-white border border-slate-200 rounded-lg p-4 text-left shadow-sm">
            <h4 className="text-sm font-bold text-slate-800 flex items-center gap-2 mb-3">
              <Info size={16} className="text-blue-500" />
              ขั้นตอนการใช้งานแอปพลิเคชัน
            </h4>
            <ul className="space-y-2 text-sm text-slate-600">
              <li className="flex items-start gap-2">
                <CheckCircle2 size={16} className="text-emerald-500 shrink-0 mt-0.5" />
                <span><b>1. อัปโหลดข้อมูล:</b> เลือกไฟล์ที่มีข้อมูลตัวเลขที่คุณต้องการวิเคราะห์</span>
              </li>
              <li className="flex items-start gap-2">
                <CheckCircle2 size={16} className="text-emerald-500 shrink-0 mt-0.5" />
                <span><b>2. จับคู่ตัวแปร:</b> เลือกว่าคอลัมน์ใดเป็นตัวแปร X และ Y แล้วกด <b>"+" เพิ่มคู่</b></span>
              </li>
              <li className="flex items-start gap-2">
                <CheckCircle2 size={16} className="text-emerald-500 shrink-0 mt-0.5" />
                <span><b>3. สั่งคำนวณ:</b> เมื่อเลือกคู่ครบแล้ว กดปุ่ม <b>"เริ่มคำนวณผลลัพธ์"</b></span>
              </li>
            </ul>
          </div>
        </div>
      );
    };

    // --- Summary Table Component ---
    const SummaryTable = ({ data, pairs, onRemove }) => {
      const tableData = useMemo(() => {
        return pairs.map(pair => {
          // Filter valid pairwise data
          const validPairs = data.filter(d => typeof d[pair.x] === 'number' && typeof d[pair.y] === 'number' && !isNaN(d[pair.x]) && !isNaN(d[pair.y]));
          const n = validPairs.length;
          
          const xData = validPairs.map(d => d[pair.x]);
          const yData = validPairs.map(d => d[pair.y]);
          
          const r = calculateCorrelation(xData, yData);
          const pValue = calculatePValue(r, n);
          
          return { id: pair.id, col1: pair.x, col2: pair.y, n, r, pValue };
        });
      }, [data, pairs]);

      return (
        <Card className="pdf-export-item overflow-hidden bg-white mb-6 border-blue-100 shadow-sm">
          <div className="p-5 border-b border-slate-200 bg-slate-50/50 flex justify-between items-center">
            <div>
              <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2">
                <Table size={20} className="text-blue-600" />
                ตารางสรุปความสัมพันธ์ (Correlation & p-value Summary)
              </h3>
              <p className="text-xs text-slate-500 mt-1">แสดงเฉพาะคู่ข้อมูลที่คุณเลือกวิเคราะห์</p>
            </div>
            <div className="text-xs font-medium px-2.5 py-1 bg-blue-100 text-blue-700 rounded-full border border-blue-200">
              ทั้งหมด {tableData.length} คู่
            </div>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm text-left text-slate-600">
              <thead className="text-xs text-slate-700 uppercase bg-slate-50 border-b border-slate-200">
                <tr>
                  <th scope="col" className="px-6 py-4">ตัวแปร X (แกนนอน)</th>
                  <th scope="col" className="px-6 py-4">ตัวแปร Y (แกนตั้ง)</th>
                  <th scope="col" className="px-4 py-4 text-center">N</th>
                  <th scope="col" className="px-6 py-4 text-center">R (Correlation)</th>
                  <th scope="col" className="px-6 py-4 text-center">p-value</th>
                  <th scope="col" className="px-4 py-4 text-center">Sig.</th>
                  <th scope="col" className="px-6 py-4">การแปลผล</th>
                  <th scope="col" className="px-4 py-4 text-center no-print">จัดการ</th>
                </tr>
              </thead>
              <tbody>
                {tableData.map((row) => {
                  const sig = getSignificanceStars(row.pValue);
                  const isSignificant = row.pValue < 0.05;
                  return (
                    <tr key={row.id} className="bg-white border-b border-slate-100 hover:bg-slate-50 transition-colors">
                      <td className="px-6 py-3 font-semibold text-slate-800">{row.col1}</td>
                      <td className="px-6 py-3 font-semibold text-slate-800">{row.col2}</td>
                      <td className="px-4 py-3 text-center">{row.n}</td>
                      <td className="px-6 py-3 text-center">
                        <span className={`px-2 py-1 rounded font-mono text-xs font-bold border ${
                          row.r > 0 ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 
                          row.r < 0 ? 'bg-rose-50 text-rose-700 border-rose-200' : 
                          'bg-slate-50 text-slate-600 border-slate-200'
                        }`}>
                          {row.r.toFixed(3)}
                        </span>
                      </td>
                      <td className="px-6 py-3 text-center font-mono text-xs">
                        {isNaN(row.pValue) ? '-' : (row.pValue < 0.001 ? '< 0.001' : row.pValue.toFixed(3))}
                      </td>
                      <td className="px-4 py-3 text-center">
                        <span className={`font-bold ${isSignificant ? 'text-blue-600' : 'text-slate-400'}`}>
                          {isNaN(row.pValue) ? '-' : sig}
                        </span>
                      </td>
                      <td className="px-6 py-3 text-xs text-slate-500">
                        {interpretCorrelation(row.r)}
                      </td>
                      <td className="px-4 py-3 text-center no-print">
                        <button 
                          onClick={() => onRemove(row.id)}
                          className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded transition-colors"
                          title="ลบคู่นี้ออก"
                        >
                          <Trash2 size={16} />
                        </button>
                      </td>
                    </tr>
                  );
                })}
                {tableData.length === 0 && (
                  <tr>
                    <td colSpan="8" className="px-6 py-12 text-center text-slate-500 bg-slate-50/50">
                      <div className="flex flex-col items-center justify-center gap-2">
                        <AlertCircle size={32} className="text-slate-300" />
                        <p className="font-semibold text-slate-600">ไม่มีข้อมูลคู่ตัวแปรในระบบ</p>
                      </div>
                    </td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
          {tableData.length > 0 && (
            <div className="p-4 bg-slate-50 text-xs text-slate-500 border-t border-slate-200 flex items-center gap-2">
              <Info size={14} className="text-blue-500" />
              <b>หมายเหตุ:</b> Sig. (Significance Level) * p &lt; 0.05, ** p &lt; 0.01, *** p &lt; 0.001, ns = Not Significant
            </div>
          )}
        </Card>
      );
    };

    const ScatterPlotCard = ({ id, data, xKey, yKey, onRemove, enableJitter, jitterLevel }) => {
      const stats = useMemo(() => {
        // Filter valid pairwise data
        const validPairs = data.filter(d => typeof d[xKey] === 'number' && typeof d[yKey] === 'number' && !isNaN(d[xKey]) && !isNaN(d[yKey]));
        const n = validPairs.length;

        const xData = validPairs.map(d => d[xKey]);
        const yData = validPairs.map(d => d[yKey]);
        const xStats = calculateStats(xData);
        const yStats = calculateStats(yData);
        const r = calculateCorrelation(xData, yData);
        const pValue = calculatePValue(r, n);

        const slope = xStats.sd !== 0 ? r * (yStats.sd / xStats.sd) : 0;
        const intercept = yStats.mean - (slope * xStats.mean);

        const minX = Math.min(...xData);
        const maxX = Math.max(...xData);
        const minY = Math.min(...yData);
        const maxY = Math.max(...yData);

        return { xStats, yStats, r, pValue, n, slope, intercept, minX, maxX, minY, maxY, validPairs };
      }, [data, xKey, yKey]);

      // Handle Jittering Logic
      const chartData = useMemo(() => {
        if (!enableJitter) return stats.validPairs;
        
        // Calculate dynamic range multiplier
        const xRange = stats.maxX - stats.minX || 1;
        const yRange = stats.maxY - stats.minY || 1;
        const jX = xRange * jitterLevel; 
        const jY = yRange * jitterLevel;

        return stats.validPairs.map(d => ({
          ...d,
          _jitteredX: d[xKey] + (Math.random() - 0.5) * jX,
          _jitteredY: d[yKey] + (Math.random() - 0.5) * jY,
        }));
      }, [stats.validPairs, enableJitter, jitterLevel, xKey, yKey, stats.maxX, stats.minX, stats.maxY, stats.minY]);

      // Dynamically determine which key the chart axes should read
      const actualXKey = enableJitter ? '_jitteredX' : xKey;
      const actualYKey = enableJitter ? '_jitteredY' : yKey;

      const trendlineData = [
        { [actualXKey]: stats.minX, [actualYKey]: (stats.slope * stats.minX) + stats.intercept, isTrendline: true },
        { [actualXKey]: stats.maxX, [actualYKey]: (stats.slope * stats.maxX) + stats.intercept, isTrendline: true }
      ];

      return (
        <Card className="pdf-export-item flex flex-col h-[500px] p-6 overflow-hidden relative group break-inside-avoid hover:shadow-md transition-shadow duration-300 bg-white border-blue-100">
           <div className="flex items-start justify-between mb-4 gap-2">
            <div className="overflow-hidden">
              <h3 className="text-base font-bold text-slate-800 truncate max-w-[250px]" style={{ fontFamily: "'Sarabun', sans-serif" }} title={`${xKey} vs ${yKey}`}>
                {xKey} <span className="text-slate-400 font-normal mx-1">vs</span> {yKey}
              </h3>
              <div className="flex items-center gap-2 mt-2">
                 <span className="text-[11px] font-medium text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-100 font-mono">
                   y = {stats.slope.toFixed(2)}x {stats.intercept >= 0 ? '+' : ''} {stats.intercept.toFixed(2)}
                 </span>
              </div>
            </div>
            <div className="flex flex-col gap-1.5 items-end">
              <div className="flex gap-2 items-center">
                <StatBadge 
                  label="R" 
                  value={stats.r} 
                  color={stats.r > 0.7 ? "bg-emerald-50 text-emerald-700 border-emerald-100" : stats.r < -0.7 ? "bg-rose-50 text-rose-700 border-rose-100" : "bg-slate-50 text-slate-600 border-slate-100"} 
                />
                {onRemove && (
                  <button 
                    onClick={() => onRemove(id)}
                    className="p-1 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors no-print"
                    title="ลบกราฟนี้"
                  >
                    <Trash2 size={16} />
                  </button>
                )}
              </div>
              <StatBadge 
                label="p-value" 
                value={isNaN(stats.pValue) ? '-' : (stats.pValue < 0.001 ? '<0.001' : stats.pValue.toFixed(3))} 
                color={stats.pValue < 0.05 ? "bg-blue-50 text-blue-700 border-blue-100" : "bg-slate-50 text-slate-500 border-slate-100"} 
              />
            </div>
          </div>
          
          {/* Stats Display */}
          <div className="flex flex-wrap gap-x-6 gap-y-2 mb-4 text-xs text-slate-600 bg-slate-50/50 p-3 rounded-lg border border-slate-100">
            <div className="flex items-center gap-3">
              <span className="font-bold text-slate-700 w-16 truncate text-right">{xKey}</span>
              <div className="h-4 w-px bg-slate-300"></div>
              <span className="font-mono text-slate-600">x̄ = {stats.xStats.mean.toFixed(2)}</span>
              <span className="font-mono text-slate-600">SD = {stats.xStats.sd.toFixed(2)}</span>
            </div>
            <div className="w-full h-px bg-slate-100 sm:hidden"></div>
            <div className="flex items-center gap-3">
              <span className="font-bold text-slate-700 w-16 truncate text-right">{yKey}</span>
              <div className="h-4 w-px bg-slate-300"></div>
              <span className="font-mono text-slate-600">x̄ = {stats.yStats.mean.toFixed(2)}</span>
              <span className="font-mono text-slate-600">SD = {stats.yStats.sd.toFixed(2)}</span>
            </div>
          </div>

          <div className="flex-1 w-full min-h-0">
            <ResponsiveContainer width="100%" height="100%">
              <ScatterChart margin={{ top: 10, right: 15, bottom: 30, left: 20 }}>
                <CartesianGrid strokeDasharray="3 3" stroke="#f1f5f9" vertical={false} />
                <XAxis 
                  type="number" 
                  dataKey={actualXKey} 
                  name={xKey} 
                  tick={{fontSize: 11, fill: '#64748b', fontFamily: 'Sarabun'}} 
                  tickLine={{ stroke: '#cbd5e1' }}
                  axisLine={{ stroke: '#475569', strokeWidth: 1 }} 
                  domain={['auto', 'auto']}
                  label={{ 
                    value: xKey, 
                    position: 'insideBottom', 
                    offset: -20, 
                    fontSize: 12, 
                    fill: '#334155',
                    style: { fontWeight: 600, fontFamily: 'Sarabun' }
                  }}
                />
                <YAxis 
                  type="number" 
                  dataKey={actualYKey} 
                  name={yKey} 
                  tick={{fontSize: 11, fill: '#64748b', fontFamily: 'Sarabun'}} 
                  tickLine={{ stroke: '#cbd5e1' }}
                  axisLine={{ stroke: '#475569', strokeWidth: 1 }}
                  domain={['auto', 'auto']}
                  label={{ 
                    value: yKey, 
                    angle: -90, 
                    position: 'insideLeft', 
                    offset: 5, 
                    fontSize: 12, 
                    fill: '#334155', 
                    style: { textAnchor: 'middle', fontWeight: 600, fontFamily: 'Sarabun' } 
                  }}
                />
                <Tooltip 
                  cursor={{ strokeDasharray: '3 3', stroke: '#cbd5e1' }}
                  content={({ active, payload }) => {
                    if (active && payload && payload.length) {
                      const p = payload[0].payload;
                      if (p.isTrendline) return null;
                      
                      // The tooltip accesses the ORIGINAL xKey and yKey, so jittering doesn't show fake values!
                      return (
                        <div className="bg-white p-3 border border-slate-200 shadow-xl rounded-lg text-xs font-sans z-50">
                           <p className="font-bold text-slate-800 mb-2 border-b border-slate-100 pb-1">{xKey} vs {yKey}</p>
                           <div className="grid grid-cols-[auto_1fr] gap-x-3 gap-y-1">
                             <span className="text-slate-500 text-right">{xKey}:</span>
                             <span className="font-mono font-medium">{p[xKey]}</span>
                             <span className="text-slate-500 text-right">{yKey}:</span>
                             <span className="font-mono font-medium">{p[yKey]}</span>
                           </div>
                        </div>
                      );
                    }
                    return null;
                  }}
                />
                <Scatter 
                  name="Data" 
                  data={chartData} 
                  fill="#3b82f6" 
                  fillOpacity={enableJitter ? 0.4 : 0.7} // More transparent when jittered to show density
                  stroke="#ffffff" 
                  strokeWidth={enableJitter ? 0 : 1}
                  r={5} 
                  isAnimationActive={false} 
                />
                <Scatter 
                  name="Trend" 
                  data={trendlineData} 
                  line={{ stroke: '#ef4444', strokeWidth: 2, strokeDasharray: '4 4' }} 
                  shape={false} 
                  activeShape={false}
                  legendType="none"
                  isAnimationActive={false}
                />
              </ScatterChart>
            </ResponsiveContainer>
          </div>
        </Card>
      );
    };

    const HeatmapCell = ({ value }) => {
      let bgColor = 'bg-white';
      let textColor = 'text-slate-800';

      if (value > 0) {
        bgColor = `rgba(59, 130, 246, ${Math.abs(value)})`; // Blue-500
        if (Math.abs(value) > 0.5) textColor = 'text-white';
      } else if (value < 0) {
        bgColor = `rgba(239, 68, 68, ${Math.abs(value)})`; // Red-500
        if (Math.abs(value) > 0.5) textColor = 'text-white';
      }

      return (
        <div 
          className={`flex items-center justify-center w-full h-12 text-xs font-medium transition-colors ${textColor}`}
          style={{ backgroundColor: bgColor }}
          title={`Correlation: ${value.toFixed(4)}`}
        >
          {value.toFixed(2)}
        </div>
      );
    };

    const Heatmap = ({ data, columns }) => {
      const correlationMatrix = useMemo(() => {
        const matrix = {};
        columns.forEach(colX => {
          matrix[colX] = {};
          columns.forEach(colY => {
            const xData = data.map(d => d[colX]);
            const yData = data.map(d => d[colY]);
            matrix[colX][colY] = calculateCorrelation(xData, yData);
          });
        });
        return matrix;
      }, [data, columns]);

      if (columns.length === 0) {
        return (
          <Card className="p-12 text-center text-slate-500">
            ไม่มีข้อมูลตัวแปรให้แสดง กรุณาเพิ่มคู่ข้อมูลและสั่งคำนวณก่อน
          </Card>
        );
      }

      return (
        <div className="space-y-6">
          <Card className="pdf-export-item p-6 overflow-auto break-inside-avoid">
            <h3 className="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
              <BarChart2 size={20} className="text-blue-600" />
              เมทริกซ์ความสัมพันธ์ (เฉพาะตัวแปรที่เลือก)
            </h3>
            <div className="min-w-max">
              <div className="flex">
                <div className="w-32 flex-shrink-0"></div>
                {columns.map(col => (
                  <div key={col} className="w-24 flex-shrink-0 p-2 text-xs font-bold text-center text-slate-600 truncate transform -rotate-45 origin-bottom-left translate-x-4 h-20 flex items-end justify-center">
                    {col}
                  </div>
                ))}
              </div>
              
              {columns.map(rowCol => (
                <div key={rowCol} className="flex items-center">
                  <div className="w-32 flex-shrink-0 p-2 text-xs font-bold text-right text-slate-600 truncate" title={rowCol}>
                    {rowCol}
                  </div>
                  {columns.map(colCol => (
                    <div key={`${rowCol}-${colCol}`} className="w-24 flex-shrink-0 border border-slate-100">
                      <HeatmapCell value={correlationMatrix[rowCol][colCol]} />
                    </div>
                  ))}
                </div>
              ))}
            </div>
            
            <div className="flex items-center justify-center gap-4 mt-8 text-xs text-slate-500">
              <div className="flex items-center gap-2">
                <div className="w-4 h-4 bg-red-500 rounded"></div>
                <span>แปรผกผัน (-1)</span>
              </div>
              <div className="flex items-center gap-2">
                <div className="w-4 h-4 bg-white border border-slate-300 rounded"></div>
                <span>ไม่สัมพันธ์ (0)</span>
              </div>
              <div className="flex items-center gap-2">
                <div className="w-4 h-4 bg-blue-500 rounded"></div>
                <span>แปรผันตามกัน (+1)</span>
              </div>
            </div>
          </Card>
        </div>
      );
    };

    // --- Main Application ---

    const App = () => {
      const [rawData, setRawData] = useState([]);
      const [headers, setHeaders] = useState([]);
      const [numericColumns, setNumericColumns] = useState([]);
      const [fileName, setFileName] = useState("");
      
      // Custom Pair Selection States
      const [draftX, setDraftX] = useState("");
      const [draftY, setDraftY] = useState("");
      
      // Pairs that are staged (currently being selected by user)
      const [stagedPairs, setStagedPairs] = useState([]);
      // Pairs that have been calculated/submitted
      const [analyzedPairs, setAnalyzedPairs] = useState([]);
      // Has the user clicked calculate?
      const [hasCalculated, setHasCalculated] = useState(false);
      
      // Global Jitter Toggles
      const [enableJitter, setEnableJitter] = useState(false);
      const [jitterLevel, setJitterLevel] = useState(0.06); // 0.03=น้อย, 0.06=มาตรฐาน, 0.12=มาก

      // Calculate Unique Columns for Heatmap based on analyzedPairs
      const heatmapColumns = useMemo(() => {
        if (analyzedPairs.length === 0) return [];
        const usedCols = new Set();
        analyzedPairs.forEach(p => {
          usedCols.add(p.x);
          usedCols.add(p.y);
        });
        // Filter original numericColumns to keep the original order
        return numericColumns.filter(col => usedCols.has(col));
      }, [analyzedPairs, numericColumns]);

      // Set default tab
      const [activeTab, setActiveTab] = useState('table'); 
      
      const [isExcelLibLoaded, setIsExcelLibLoaded] = useState(false);
      const [isJStatLoaded, setIsJStatLoaded] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [isExporting, setIsExporting] = useState(false);

      // Load External Libraries
      useEffect(() => {
        const loadScript = (src) => {
          return new Promise((resolve, reject) => {
            if (document.querySelector(`script[src="${src}"]`)) {
              resolve();
              return;
            }
            const script = document.createElement('script');
            script.src = src;
            script.async = true;
            script.onload = resolve;
            script.onerror = reject;
            document.body.appendChild(script);
          });
        };

        // Load XLSX
        if (!window.XLSX) {
          loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js")
            .then(() => setIsExcelLibLoaded(true))
            .catch(err => console.error("XLSX load error", err));
        } else {
          setIsExcelLibLoaded(true);
        }
        
        // Load jStat for advanced statistics (p-value)
        if (!window.jStat) {
          loadScript("https://cdnjs.cloudflare.com/ajax/libs/jstat/1.9.6/jstat.min.js")
            .then(() => setIsJStatLoaded(true))
            .catch(err => console.error("jStat load error", err));
        } else {
          setIsJStatLoaded(true);
        }

        // Load PDF Libs
        Promise.all([
          loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),
          loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")
        ]).catch(err => console.error("PDF Libs load error", err));

      }, []);

      const processData = (headers, data, name) => {
        if (data.length === 0) {
          alert("ไม่พบข้อมูลในไฟล์");
          return;
        }

        setRawData(data);
        setHeaders(headers);
        setFileName(name);

        const numCols = headers.filter(header => {
          let numCount = 0;
          let totalCount = 0;
          for(let i=0; i<Math.min(data.length, 10); i++) {
             if(data[i][header] !== undefined && data[i][header] !== '') {
               totalCount++;
               if(typeof data[i][header] === 'number') numCount++;
             }
          }
          return totalCount > 0 && numCount === totalCount;
        });
        
        setNumericColumns(numCols);
        
        // Set default draft selections
        if (numCols.length > 0) {
          setDraftX(numCols[0]);
          setDraftY(numCols.length > 1 ? numCols[1] : numCols[0]);
        }
        
        // Reset all pair states
        setStagedPairs([]);
        setAnalyzedPairs([]);
        setHasCalculated(false);
        setIsLoading(false);
      };

      const handleFileSelected = (file) => {
        setIsLoading(true);
        const fileName = file.name.toLowerCase();
        
        if (fileName.endsWith('.csv')) {
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const { headers: parsedHeaders, data } = parseCSV(e.target.result);
              processData(parsedHeaders, data, file.name);
            } catch (error) {
              console.error(error);
              alert("เกิดข้อผิดพลาดในการอ่านไฟล์ CSV");
              setIsLoading(false);
            }
          };
          reader.readAsText(file);
        } 
        else if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
          if (!isExcelLibLoaded) {
            alert("กำลังโหลดไลบรารีสำหรับอ่าน Excel กรุณารอสักครู่แล้วลองใหม่");
            setIsLoading(false);
            return;
          }
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const data = new Uint8Array(e.target.result);
              const workbook = window.XLSX.read(data, { type: 'array' });
              const firstSheetName = workbook.SheetNames[0];
              const worksheet = workbook.Sheets[firstSheetName];
              const jsonData = window.XLSX.utils.sheet_to_json(worksheet, { header: 1 });
              
              if (jsonData.length < 2) {
                 alert("ไฟล์ Excel ไม่มีข้อมูลเพียงพอ");
                 setIsLoading(false);
                 return;
              }

              const rawHeaders = jsonData[0];
              const headers = rawHeaders.map(h => cleanHeader(h));
              const processedData = jsonData.slice(1).map(row => {
                if (row.length === 0) return null;
                const entry = {};
                headers.forEach((header, i) => {
                  let val = row[i];
                  if (val !== undefined && val !== null) {
                     const numVal = parseFloat(val);
                     entry[header] = isNaN(numVal) ? val : numVal;
                  } else {
                     entry[header] = '';
                  }
                });
                return entry;
              }).filter(r => r !== null);

              processData(headers, processedData, file.name);
            } catch (error) {
              console.error(error);
              alert("เกิดข้อผิดพลาดในการอ่านไฟล์ Excel");
              setIsLoading(false);
            }
          };
          reader.readAsArrayBuffer(file);
        } else {
          alert("รองรับเฉพาะไฟล์ .csv และ .xlsx/.xls เท่านั้น");
          setIsLoading(false);
        }
      };

      const handleReset = () => {
        setRawData([]);
        setHeaders([]);
        setNumericColumns([]);
        setFileName("");
        setStagedPairs([]);
        setAnalyzedPairs([]);
        setHasCalculated(false);
        setActiveTab('table');
      };

      const handleAddPair = () => {
        if (!draftX || !draftY) return;
        
        // Check for exact duplicate pairs in staged pairs
        if (stagedPairs.some(p => p.x === draftX && p.y === draftY)) {
          alert(`คุณได้เพิ่มคู่ ${draftX} และ ${draftY} ไปแล้วครับ`);
          return;
        }

        setStagedPairs([...stagedPairs, { id: Date.now(), x: draftX, y: draftY }]);
      };

      const handleRemoveStagedPair = (idToRemove) => {
        setStagedPairs(stagedPairs.filter(p => p.id !== idToRemove));
      };

      // When a user removes a pair from the generated results (table or scatter)
      const handleRemoveAnalyzedPair = (idToRemove) => {
        setAnalyzedPairs(analyzedPairs.filter(p => p.id !== idToRemove));
        setStagedPairs(stagedPairs.filter(p => p.id !== idToRemove)); // Sync staged pairs too
      };

      const handleCalculate = () => {
        if (stagedPairs.length === 0) {
          alert("กรุณาเลือกคู่ข้อมูลอย่างน้อย 1 คู่ แล้วกด + เพิ่มคู่ข้อมูล");
          return;
        }
        setAnalyzedPairs([...stagedPairs]);
        setHasCalculated(true);
        setActiveTab('table'); // Auto switch to table view
      };

      const handleExportPDF = async () => {
        if (!window.html2canvas || !window.jspdf) {
          alert("กรุณารอสักครู่ กำลังโหลดไลบรารีสำหรับ PDF...");
          return;
        }

        setIsExporting(true);
        
        // Scroll to top to prevent clipping
        window.scrollTo(0, 0);

        // Hide UI elements not meant for printing
        const noPrintElements = document.querySelectorAll('.no-print');
        noPrintElements.forEach(el => el.style.display = 'none');

        // Wait for UI to settle and fonts to load
        await new Promise(resolve => setTimeout(resolve, 800));

        try {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF('p', 'mm', 'a4');
          const pageWidth = pdf.internal.pageSize.getWidth();
          const pageHeight = pdf.internal.pageSize.getHeight();
          const margin = 10;
          const contentWidth = pageWidth - (margin * 2);
          
          let currentY = margin;

          const elements = document.querySelectorAll('.pdf-export-item');

          if (elements.length === 0) {
            alert("ไม่พบเนื้อหาที่จะ Export ในแท็บนี้");
            setIsExporting(false);
            noPrintElements.forEach(el => el.style.display = ''); // Restore
            return;
          }

          for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            
            const canvas = await window.html2canvas(element, { 
              scale: 2, // High resolution
              useCORS: true,
              logging: false,
              backgroundColor: '#ffffff',
              windowWidth: 1440, // Simulate desktop width
              onclone: (documentClone) => {
                  const el = documentClone.getElementById(element.id);
                  if(el) el.style.visibility = 'visible';
              }
            });

            const imgData = canvas.toDataURL('image/png');
            const imgWidth = contentWidth;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;

            if (currentY + imgHeight > pageHeight - margin) {
              pdf.addPage();
              currentY = margin;
            }

            pdf.addImage(imgData, 'PNG', margin, currentY, imgWidth, imgHeight);
            currentY += imgHeight + 5; 
          }
          
          pdf.save(`Report_${fileName}.pdf`);

        } catch (error) {
          console.error("PDF Export Error:", error);
          alert("เกิดข้อผิดพลาดในการสร้าง PDF");
        } finally {
          setIsExporting(false);
          // Restore non-printable elements
          noPrintElements.forEach(el => el.style.display = '');
        }
      };

      // Helper check to see if we need a recalculate
      const needsRecalculation = stagedPairs.length !== analyzedPairs.length || !stagedPairs.every((sp, i) => analyzedPairs[i] && sp.id === analyzedPairs[i].id);

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 p-6">
          <div className="max-w-7xl mx-auto space-y-6">
            
            <header className="flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div>
                <h1 className="text-3xl font-bold text-slate-900 flex items-center gap-3">
                  <Activity className="text-blue-600" />
                  Data Analytics Dashboard
                </h1>
                <p className="text-slate-500 mt-1">อัปโหลด CSV หรือ Excel เพื่อวิเคราะห์ความสัมพันธ์ของข้อมูลแบบเลือกคู่ (Custom Pair Analysis)</p>
              </div>
              <div className="flex gap-2">
                {rawData.length > 0 && (
                  <>
                    <button 
                      onClick={handleExportPDF}
                      disabled={isExporting || !hasCalculated}
                      className={`flex items-center gap-2 px-4 py-2 text-sm font-medium text-white rounded-lg shadow-sm transition-colors
                        ${(isExporting || !hasCalculated) ? 'bg-slate-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}
                    >
                      {isExporting ? <Loader size={16} className="animate-spin" /> : <Download size={16} />}
                      {isExporting ? 'Generating PDF...' : 'Export PDF แท็บปัจจุบัน'}
                    </button>
                    <button 
                      onClick={handleReset}
                      className="flex items-center gap-2 px-4 py-2 text-sm font-medium text-red-600 bg-white border border-red-200 rounded-lg hover:bg-red-50 transition-colors shadow-sm"
                    >
                      <X size={16} />
                      ล้างข้อมูล
                    </button>
                  </>
                )}
              </div>
            </header>

            {rawData.length === 0 ? (
              <Card className="max-w-3xl mx-auto mt-12 overflow-hidden border border-slate-200 shadow-md">
                {isLoading ? (
                  <div className="flex flex-col items-center justify-center h-64 bg-slate-50">
                    <Loader className="w-10 h-10 text-blue-500 animate-spin mb-4" />
                    <p className="text-slate-600 font-medium">กำลังประมวลผลไฟล์ กรุณารอสักครู่...</p>
                  </div>
                ) : (
                  <FileUploader onFileSelected={handleFileSelected} />
                )}
              </Card>
            ) : (
              <div id="dashboard-content" className="space-y-6">
                
                <div className="pdf-export-item pb-4 border-b border-slate-300">
                   <h2 className="text-xl font-bold text-slate-800">รายงานการวิเคราะห์ข้อมูล</h2>
                   <div className="flex flex-wrap gap-4 mt-2 text-sm text-slate-600">
                     <span><b>ไฟล์:</b> {fileName}</span>
                     <span><b>วันที่:</b> {new Date().toLocaleDateString('th-TH')}</span>
                     <span><b>จำนวนข้อมูลทั้งหมด:</b> {rawData.length} แถว</span>
                   </div>
                </div>

                {/* --- PAIR BUILDER UI --- */}
                <div className="bg-white p-5 rounded-xl border-2 border-blue-100 shadow-sm flex flex-col gap-5 no-print">
                   <div>
                     <h3 className="text-base font-bold text-blue-800 mb-3 flex items-center gap-2">
                       <PlusCircle size={20} />
                       จัดเตรียมคู่ข้อมูลที่ต้องการวิเคราะห์ (Pair Selection)
                     </h3>
                     <div className="flex flex-col md:flex-row gap-4 items-end">
                       <div className="flex-1 grid grid-cols-1 md:grid-cols-2 gap-4">
                         <div>
                           <label className="block text-xs font-semibold text-slate-600 mb-1">ตัวแปรหลัก X (เหตุ)</label>
                           <select 
                             value={draftX} 
                             onChange={(e) => setDraftX(e.target.value)}
                             className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none"
                           >
                             {numericColumns.map(col => <option key={`x-${col}`} value={col}>{col}</option>)}
                           </select>
                         </div>
                         <div>
                           <label className="block text-xs font-semibold text-slate-600 mb-1">ตัวแปรตาม Y (ผล)</label>
                           <select 
                             value={draftY} 
                             onChange={(e) => setDraftY(e.target.value)}
                             className="w-full p-2.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none"
                           >
                             {numericColumns.map(col => <option key={`y-${col}`} value={col}>{col}</option>)}
                           </select>
                         </div>
                       </div>
                       <button 
                         onClick={handleAddPair}
                         className="w-full md:w-auto shrink-0 px-6 py-3 bg-blue-50 border border-blue-200 hover:bg-blue-100 text-blue-700 text-sm font-bold rounded-lg shadow-sm flex items-center justify-center gap-2 transition-colors"
                       >
                         <PlusCircle size={18} />
                         เพิ่มคู่ข้อมูล
                       </button>
                     </div>
                   </div>

                   {/* Staged Pairs Visualization */}
                   {stagedPairs.length > 0 && (
                     <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                       <h4 className="text-xs font-semibold text-slate-600 mb-3 flex items-center gap-2">
                         คู่ข้อมูลที่รอการคำนวณ 
                         <span className="bg-blue-600 text-white px-2 py-0.5 rounded-full text-[10px]">{stagedPairs.length}</span>
                       </h4>
                       <div className="flex flex-wrap gap-2">
                         {stagedPairs.map((pair) => (
                           <div key={pair.id} className="flex items-center gap-1.5 bg-white border border-slate-300 px-3 py-1.5 rounded-full text-sm shadow-sm">
                             <span className="font-semibold text-blue-600">{pair.x}</span>
                             <span className="text-slate-400 text-[10px] uppercase">vs</span>
                             <span className="font-semibold text-rose-600">{pair.y}</span>
                             <div className="w-px h-3 bg-slate-300 mx-1"></div>
                             <button 
                               onClick={() => handleRemoveStagedPair(pair.id)} 
                               className="text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-full p-0.5 transition-colors"
                             >
                               <X size={14} />
                             </button>
                           </div>
                         ))}
                       </div>
                     </div>
                   )}

                   {/* Calculate Button */}
                   <div className="pt-2 flex justify-end">
                     <button 
                       onClick={handleCalculate}
                       disabled={stagedPairs.length === 0}
                       className={`px-8 py-3 text-white text-sm font-bold rounded-lg shadow-md flex items-center justify-center gap-2 transition-all transform 
                         ${stagedPairs.length === 0 ? 'bg-slate-300 cursor-not-allowed opacity-70' : 
                           (needsRecalculation && hasCalculated) ? 'bg-amber-500 hover:bg-amber-600 hover:-translate-y-0.5' : 
                           'bg-emerald-600 hover:bg-emerald-700 hover:-translate-y-0.5'}`}
                     >
                       {needsRecalculation && hasCalculated ? (
                         <>
                           <Loader size={18} />
                           อัปเดตผลการคำนวณ
                         </>
                       ) : (
                         <>
                           <Play size={18} fill="currentColor" />
                           เริ่มคำนวณผลลัพธ์
                         </>
                       )}
                     </button>
                   </div>
                </div>

                {/* Results Section - Hidden until calculate is clicked */}
                {hasCalculated && (
                  <div className="animate-in slide-in-from-bottom-4 duration-500 fade-in">
                    <div className="flex items-center gap-1 border-b border-slate-200 overflow-x-auto no-print">
                      <button
                        onClick={() => setActiveTab('table')}
                        className={`px-6 py-3 text-sm font-bold transition-colors border-b-2 flex items-center gap-2 whitespace-nowrap
                          ${activeTab === 'table' 
                            ? 'border-blue-600 text-blue-700 bg-white' 
                            : 'border-transparent text-slate-500 hover:text-slate-700 hover:bg-white/50'}`}
                      >
                        <Table size={18} />
                        ตารางสรุปผล (Table)
                      </button>
                      <button
                        onClick={() => setActiveTab('scatter')}
                        className={`px-6 py-3 text-sm font-bold transition-colors border-b-2 flex items-center gap-2 whitespace-nowrap
                          ${activeTab === 'scatter' 
                            ? 'border-blue-600 text-blue-700 bg-white' 
                            : 'border-transparent text-slate-500 hover:text-slate-700 hover:bg-white/50'}`}
                      >
                        <Grid size={18} />
                        กราฟแสดงความสัมพันธ์ (Scatter Plots)
                      </button>
                      <button
                        onClick={() => setActiveTab('heatmap')}
                        className={`px-6 py-3 text-sm font-bold transition-colors border-b-2 flex items-center gap-2 whitespace-nowrap
                          ${activeTab === 'heatmap' 
                            ? 'border-blue-600 text-blue-700 bg-white' 
                            : 'border-transparent text-slate-500 hover:text-slate-700 hover:bg-white/50'}`}
                      >
                        <BarChart2 size={18} />
                        ภาพรวมทุกตัวแปร (Heatmap)
                      </button>
                    </div>

                    <div className="py-4">
                      
                      {/* Tab 1: Summary Table */}
                      {activeTab === 'table' && (
                        <div className="space-y-4 animate-in fade-in duration-300">
                          {!isJStatLoaded ? (
                            <div className="text-center py-12 text-slate-500 flex flex-col items-center gap-3">
                               <Loader className="animate-spin text-blue-500" />
                               กำลังโหลดโมดูลสถิติ (Statistics Library)...
                            </div>
                          ) : (
                            <SummaryTable data={rawData} pairs={analyzedPairs} onRemove={handleRemoveAnalyzedPair} />
                          )}
                        </div>
                      )}

                      {/* Tab 2: Scatter Plots */}
                      {activeTab === 'scatter' && (
                        <div className="space-y-4 animate-in fade-in duration-300">
                          <div className="flex flex-wrap justify-between items-center gap-4 no-print">
                             <div className="flex items-center gap-3">
                               <h2 className="text-lg font-bold text-slate-800">กราฟคู่ข้อมูลที่คุณเลือก</h2>
                               {analyzedPairs.length > 0 && (
                                 <span className="text-xs font-medium text-blue-700 bg-blue-100 px-3 py-1 rounded-full border border-blue-200">
                                   ทั้งหมด {analyzedPairs.length} กราฟ
                                 </span>
                               )}
                             </div>
                             {analyzedPairs.length > 0 && (
                               <div className="flex items-center gap-3 bg-white px-4 py-2 rounded-xl border border-slate-200 shadow-sm">
                                 <label className="flex items-center gap-2 cursor-pointer text-sm font-bold text-slate-700">
                                   <input 
                                     type="checkbox" 
                                     checked={enableJitter} 
                                     onChange={(e) => setEnableJitter(e.target.checked)}
                                     className="w-4 h-4 text-blue-600 rounded focus:ring-blue-500 border-slate-300 cursor-pointer"
                                   />
                                   <Shuffle size={16} className={enableJitter ? 'text-blue-600' : 'text-slate-400'} />
                                   กระจายจุด (Jittering)
                                 </label>
                                 
                                 {enableJitter && (
                                   <>
                                     <div className="w-px h-5 bg-slate-300 mx-1"></div>
                                     <div className="flex items-center gap-2">
                                       <span className="text-xs font-medium text-slate-500">ขนาด:</span>
                                       <select 
                                         value={jitterLevel} 
                                         onChange={(e) => setJitterLevel(parseFloat(e.target.value))}
                                         className="text-xs font-semibold text-blue-700 bg-blue-50 border border-blue-200 rounded px-2 py-1 outline-none cursor-pointer focus:ring-2 focus:ring-blue-500"
                                       >
                                         <option value={0.03}>น้อย</option>
                                         <option value={0.06}>มาตรฐาน</option>
                                         <option value={0.12}>มาก</option>
                                       </select>
                                     </div>
                                   </>
                                 )}
                               </div>
                             )}
                          </div>

                          {analyzedPairs.length === 0 ? (
                            <div className="text-center py-16 bg-white border border-slate-200 rounded-xl shadow-sm no-print">
                              <div className="flex flex-col items-center justify-center gap-3">
                                <div className="w-16 h-16 bg-blue-50 text-blue-400 rounded-full flex items-center justify-center mb-2">
                                   <Grid size={32} />
                                </div>
                                <h3 className="text-lg font-bold text-slate-700">ไม่มีกราฟที่จะแสดง</h3>
                                <p className="text-slate-500 max-w-sm text-sm">
                                  คุณลบกราฟออกหมดแล้ว โปรดเพิ่มคู่ข้อมูลใหม่ด้านบน
                                </p>
                              </div>
                            </div>
                          ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-2 gap-6">
                              {analyzedPairs.map((pair) => (
                                <ScatterPlotCard 
                                  key={pair.id} 
                                  id={pair.id}
                                  data={rawData} 
                                  xKey={pair.x} 
                                  yKey={pair.y} 
                                  onRemove={handleRemoveAnalyzedPair}
                                  enableJitter={enableJitter}
                                  jitterLevel={jitterLevel}
                                />
                              ))}
                            </div>
                          )}
                        </div>
                      )}

                      {/* Tab 3: Heatmap (Filtered by selected columns) */}
                      {activeTab === 'heatmap' && (
                        <div className="space-y-4 animate-in fade-in duration-300">
                          <Heatmap data={rawData} columns={heatmapColumns} />
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
